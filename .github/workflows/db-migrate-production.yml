name: Production Database Migration

on:
  push:
    branches: [main]
    # NOTE: Path filter removed - doesn't work reliably with merge commits
    # Step-level check (line 79) detects if migrations actually changed
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "MIGRATE" to confirm manual migration'
        required: true

# Prevent concurrent migrations - CRITICAL for database safety
concurrency:
  group: production-migration
  cancel-in-progress: false # Never cancel running migrations!

jobs:
  migrate:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only run if:
    # 1. Manual trigger with confirmation, OR
    # 2. Push from merged PR (detected via GitHub web-flow committer or merge commit message)
    #
    # Detection methods:
    # - web-flow: GitHub's official merge bot (handles all merge types from GitHub UI)
    # - "Merge pull request": Traditional merge commit message pattern
    #
    # Note: Removed generic '(#' pattern as it could match unintended commits.
    # The web-flow check covers squash and rebase merges done via GitHub UI.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        github.event.head_commit.committer.username == 'web-flow' ||
        contains(github.event.head_commit.message, 'Merge pull request')
      ))

    env:
      # Use production-specific secret (separate from integration test DATABASE_URL)
      DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

    steps:
      - name: Validate manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "MIGRATE" ]; then
            echo "::error::Manual migration requires typing 'MIGRATE' to confirm"
            echo ""
            echo "This safety check prevents accidental production migrations."
            echo "Please run the workflow again and type 'MIGRATE' in the confirmation field."
            exit 1
          fi
          echo "Manual migration confirmed by ${{ github.actor }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Need previous commit to compare

      - name: Validate production database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_PRODUCTION secret is not configured"
            echo ""
            echo "Please add the DATABASE_URL_PRODUCTION secret in repository settings:"
            echo "Settings > Secrets and variables > Actions > New repository secret"
            echo ""
            echo "Value format: postgresql://postgres.[ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres"
            echo ""
            echo "See docs/development-setup.md for detailed setup instructions."
            exit 1
          fi
          echo "Production database secret is configured"

      - name: Check for migration files
        id: check-migrations
        run: |
          echo "Checking for migration file changes..."

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger: always proceed (user explicitly requested migration)
            echo "Manual trigger detected - proceeding with migration"
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "migration_files=Manual trigger - applying all pending migrations" >> $GITHUB_OUTPUT
          else
            # Push trigger: check changed files
            # NOTE: git diff HEAD~1 HEAD assumes linear history. With rebase merges,
            # HEAD~1 is the previous commit on main, not the PR's base commit.
            # This is acceptable because the path filter 'drizzle/**' in the trigger
            # already ensures migration files changed. This check is primarily for
            # manual triggers where path filtering doesn't apply.
            #
            # Edge cases handled safely:
            # - Force-pushed rebases: Path filter catches migration changes, this is a secondary check
            # - Amended commits on main: Should be prevented by branch protection rules
            # - Squash merges: web-flow committer check ensures this came from a PR merge
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

            if [ -z "$CHANGED_FILES" ]; then
              echo "::warning::Could not determine changed files"
              echo "has_migrations=true" >> $GITHUB_OUTPUT
              echo "migration_files=Unable to determine - applying all pending migrations" >> $GITHUB_OUTPUT
            else
              echo "Changed files in this commit:"
              echo "$CHANGED_FILES"
              echo ""

              # Check if any drizzle migration files changed
              MIGRATION_FILES=$(echo "$CHANGED_FILES" | grep '^drizzle/' || true)

              if [ -z "$MIGRATION_FILES" ]; then
                echo "::notice::No migration files changed in drizzle/. Skipping migration."
                echo "has_migrations=false" >> $GITHUB_OUTPUT
              else
                echo "Migration files detected:"
                echo "$MIGRATION_FILES"
                echo "has_migrations=true" >> $GITHUB_OUTPUT
                # Store migration files using delimiter for multiline output
                {
                  echo "migration_files<<MIGRATION_EOF"
                  echo "$MIGRATION_FILES"
                  echo "MIGRATION_EOF"
                } >> $GITHUB_OUTPUT
              fi
            fi
          fi

      - name: Setup pnpm
        if: steps.check-migrations.outputs.has_migrations == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: steps.check-migrations.outputs.has_migrations == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check-migrations.outputs.has_migrations == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        if: steps.check-migrations.outputs.has_migrations == 'true'
        id: migrate
        run: |
          set -o pipefail  # Ensure pipe failures are captured correctly

          echo "Applying database migrations to production..."
          echo ""
          echo "Using programmatic migration (see CLAUDE.md for drizzle-kit bug details)"
          echo ""

          # Run migration using programmatic approach (not drizzle-kit - see CLAUDE.md)
          npx tsx scripts/run-migrations.ts 2>&1 | tee migration-output.txt
          MIGRATE_EXIT_CODE=$?

          if [ $MIGRATE_EXIT_CODE -eq 0 ]; then
            echo "migrate_status=success" >> $GITHUB_OUTPUT
            echo ""
            echo "Migrations applied successfully"
          else
            echo "migrate_status=failed" >> $GITHUB_OUTPUT
            echo ""
            echo "::error::Migration failed with exit code $MIGRATE_EXIT_CODE"
            echo ""
            echo "IMPORTANT: Manual intervention required."
            echo "Do NOT retry automatically - investigate the failure first."
            exit $MIGRATE_EXIT_CODE
          fi

      - name: Verify migrations applied
        if: steps.migrate.outputs.migrate_status == 'success'
        id: verify
        run: |
          echo "Verifying all migrations were applied..."
          echo ""

          # Run verification script
          npx tsx scripts/verify-migrations.ts || {
            echo "::error::Migration verification failed"
            echo "migrate_verified=false" >> $GITHUB_OUTPUT
            exit 1
          }

          echo ""
          echo "migrate_verified=true" >> $GITHUB_OUTPUT
          echo "All migrations verified successfully"

      - name: Create job summary
        if: always()
        run: |
          echo "## Production Database Migration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check-migrations.outputs.has_migrations }}" == "false" ]; then
            echo "### Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No migration files were changed in this commit." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The workflow detected no changes in the \`drizzle/\` directory." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.migrate.outputs.migrate_status }}" == "success" ]; then
            echo "### Success" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "${{ steps.verify.outputs.migrate_verified }}" == "true" ]; then
              echo "✅ Migrations applied and verified" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Migrations applied but verification incomplete" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Migration files:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.check-migrations.outputs.migration_files }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            if [ -f migration-output.txt ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>Migration Output</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              # Truncate output to prevent exceeding GitHub summary size limits (max ~1MB)
              head -c 50000 migration-output.txt >> $GITHUB_STEP_SUMMARY
              if [ $(wc -c < migration-output.txt) -gt 50000 ]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "... (output truncated, see artifacts for full log)" >> $GITHUB_STEP_SUMMARY
              fi
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ steps.migrate.outputs.migrate_status }}" == "failed" ]; then
            echo "### Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Migration files:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.check-migrations.outputs.migration_files }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            if [ -f migration-output.txt ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Error output:**" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              # Truncate output to prevent exceeding GitHub summary size limits (max ~1MB)
              head -c 50000 migration-output.txt >> $GITHUB_STEP_SUMMARY
              if [ $(wc -c < migration-output.txt) -gt 50000 ]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "... (output truncated, see artifacts for full log)" >> $GITHUB_STEP_SUMMARY
              fi
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Manual intervention required.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Review the error output above" >> $GITHUB_STEP_SUMMARY
            echo "2. Check the Supabase dashboard for database status" >> $GITHUB_STEP_SUMMARY
            echo "3. Fix the migration issue locally" >> $GITHUB_STEP_SUMMARY
            echo "4. Push a new commit with the fix, or manually apply migrations" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See \`docs/development-setup.md\` for troubleshooting guidance." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Unknown Status" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The migration status could not be determined. Check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload migration output
        if: always() && steps.check-migrations.outputs.has_migrations == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: migration-output
          path: migration-output.txt
          retention-days: 30
          if-no-files-found: ignore
